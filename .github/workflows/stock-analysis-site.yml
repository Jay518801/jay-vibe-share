name: Stock analysis site
on:
  push:
    branches: [feat/stock-analysis-site]
    paths: ['frontend/**', '.github/workflows/stock-analysis-site.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/stock-analysis-site.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test tests/stockResearch.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-frontend
          path: frontend/dist
          retention-days: 7
